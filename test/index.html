<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- [CACHE] index.html için no-cache = "kullanmadan önce YENİDEN-DOĞRULA" (no-store DEĞİL → değişmediyse
       304 döner, bundle'ı yeniden indirmez). GitHub Pages bare link'in (kaenden.github.io/swingwreck) ?sorgu
       olmadan hep güncel index.html almasını sağlar; Vite hash'li asset'ler zaten cache-güvenli, CrazyGames'i sabote etmez. -->
  <meta http-equiv="Cache-Control" content="no-cache" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Block Titans</title>
  <link rel="icon" type="image/png" href="./favicon.png" />
  <!-- CrazyGames HTML5 SDK v3. v2'den farkı: init() ZORUNLU (AdSystem._initCrazyGames await ediyor) ve
       loading event'leri yeniden adlandı (sdkGameLoadingStart/Stop → loadingStart/Stop, BootScene'de). Yerel/dev'de 'local' ortam → test reklamı; yayında gerçek. -->
  <script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100vh;            /* fallback */
      height: 100dvh;           /* mobil dinamik viewport — tarayıcı çubuğu hesaba katılır */
      overflow: hidden;
      touch-action: none;       /* mobil scroll/zoom kapalı */
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none; user-select: none;   /* [CG] mobil uzun-bas metin seçimi engellenir (gereksinim) */
      position: fixed; inset: 0;
      /* [CG] Letterbox bar'ları = BLUR'LU GECE SAHNESİ backdrop (masaüstü geniş-ekranda boş gradient yerine
         atmosferik, kasıtlı tasarlanmış görünüm — CG "empty/unprofessional" izlenimini kapatır). */
      background: #0A0E22 url('./assets/backgrounds/backdrop.webp') center center / cover no-repeat;
    }
    /* Ortalamayı YALNIZCA Phaser yapsın (CENTER_BOTH). CSS flex ile çift-ortalama
       asimetri yaratıyordu (üst boş / alt taşma). Container sadece tam ekran. */
    #game-container { width: 100%; height: 100%; }
    canvas { display: block; }
    /* [v2.6] Çok uzun ekranlarda (oran > 2.6) tuval dikeyde ortalanır ve üstte/altta backdrop şeridi kalır —
       kullanıcı: "barın üst kısmı kapatmıyor gibi, arkadan geçiş görünüyor". Kalan şerit oyun alanı gibi değil,
       ÇERÇEVE gibi görünsün diye üst şerit HUD barının rengiyle, alt şerit zemin koyusuyla boyanır.
       Yükseklik ScreenFit.paintBands() tarafından --band-v ile verilir (yatay şeritler = masaüstü, backdrop kalır). */
    #band-top, #band-bottom { position: fixed; left: 0; right: 0; height: var(--band-v, 0px); pointer-events: none; z-index: 3; }
    #band-top { top: 0; background: #0F1626; box-shadow: inset 0 -2px 0 #7A6538; }
    #band-bottom { bottom: 0; background: #080C18; }
  </style>
  <script type="module" crossorigin src="./assets/index-Ahxe2agQ.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/phaser-DdCsgmnN.js">
  <link rel="stylesheet" crossorigin href="./assets/index-oDydlEX2.css">
</head>
<body>
  <div id="game-container"></div>
  <div id="band-top"></div><div id="band-bottom"></div>
</body>
</html>
